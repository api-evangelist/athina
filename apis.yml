  - url: collections/athina.postman_collection.json
    type: PostmanCollection
  - url: collections/athina.opencollection.json
    type: OpenCollection
  description: Create datasets, list and retrieve datasets, add up to 1000 rows
    (query, context, response, expected_response and custom fields), update
