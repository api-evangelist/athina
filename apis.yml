    type: Documentation
  - url: https://docs.athina.ai/api-reference/logging/tracing-via-api
    type: APIReference
  - url: openapi/athina-openapi.yml
    type: OpenAPI
  - url: collections/athina.postman_collection.json
    type: PostmanCollection
  - url: collections/athina.opencollection.json
    type: OpenCollection
  description: Log LLM inferences and prompt runs (prompt, response, model, tokens,
    cost, context, customer/session metadata), update logs by id or external
    reference, and build nested traces with spans for end-to-end observability.
- aid: athina:athina-datasets-api
  name: Athina Datasets API
  tags:
  - Datasets
  - Data Management
