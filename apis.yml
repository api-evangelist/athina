aid: athina
url: https://raw.githubusercontent.com/api-evangelist/athina/refs/heads/main/apis.yml
name: Athina AI
kind: company
description: Athina AI is an LLM monitoring, evaluation, and experimentation platform
  for building production-grade AI applications. Its REST API lets teams log inferences
  and traces, manage datasets, run 50+ preset and custom evaluations, version and
  run prompt templates, and collaborate on experiments across the full LLM
  development lifecycle.
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
tags:
- AI
- LLM
- Observability
- Evaluation
- Monitoring
created: '2026-06-20'
modified: '2026-06-20'
specificationVersion: '0.19'
apis:
- aid: athina:athina-logging-inferences-api
  name: Athina Logging & Inferences API
  tags:
  - Logging
  - Inferences
  - Tracing
  - Observability
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
