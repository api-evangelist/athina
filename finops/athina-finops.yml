meters:
- name: logs
  description: Logged LLM inferences / prompt runs; metered against the plan monthly allowance.
  unit: logs
  aggregation: sum
  dimensions:
  - account
  - environment
  - prompt_slug
- name: evaluations
  description: Evaluation runs executed against datasets and logged inferences.
  unit: eval_runs
  aggregation: sum
  dimensions:
  - account
  - dataset
- name: grader_tokens
  description: Third-party LLM tokens consumed by eval graders (e.g. OpenAI), billed by the model provider, not Athina.
  unit: tokens
  aggregation: sum
  dimensions:
  - account
  - model
- name: datasets
  description: Datasets created and stored, each capped at 1000 rows.
  unit: datasets
  aggregation: sum
  dimensions:
  - account
- name: seats
  description: Team seats on the account; unlimited on Pro and Enterprise.
  unit: seats
  aggregation: max
  dimensions:
  - account
principles:
- name: Visibility
  description: Track monthly log volume against the plan allowance in the Athina platform; tag logs with environment, prompt_slug, and customer_id.
- name: Allocation
  description: Segment logs by customer_id / customer_user_id and environment to map observability spend to teams and workloads.
- name: Optimization
  description: Sample or filter low-value logs to stay within allowances; batch evaluations and choose cheaper grader models to reduce third-party token spend.
- name: Accountability
  description: Assign owners per project and review log volume and grader-token spend before upgrading tiers.
