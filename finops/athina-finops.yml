publisherName: Athina AI
serviceCategory: AI and Machine Learning
billingModel:
  pricingCategory: Subscription
  billingFrequency: Monthly
  billingCurrency: USD
  chargeCategories:
  - Usage
  - Purchase
focusColumns:
  ServiceName: Athina AI Platform
  ServiceCategory: AI and Machine Learning
  ProviderName: Athina AI
  PublisherName: Athina AI
  InvoiceIssuerName: Athina AI
  BillingCurrency: USD
