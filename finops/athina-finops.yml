description: >-
  FinOps view of Athina AI spend. Athina is a sales-led SaaS observability and
  evaluation platform: a free tier with a 10k-log monthly allowance, a
  quote-based Pro subscription with unlimited logs/evals/datasets/seats, and a
  custom Enterprise tier with self-hosted deployment. The primary cost driver
  is logged-inference volume; evaluation runs additionally consume third-party
  LLM grader tokens (e.g. OpenAI) billed outside Athina. Per-seat and per-log
  contract rates are not public, so spend is not reconciled here.
notes: >-
  Pro and Enterprise pricing is contact-sales; only the free tier log allowance
  is public. Evaluation grading typically incurs separate LLM provider token
  costs. Verify contract metering and seat counts during reconciliation.
sources:
- https://www.athina.ai/pricing
- https://docs.athina.ai
- https://focus.finops.org/focus-specification/v1-3/
